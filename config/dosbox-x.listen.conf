# Interactive listen/playtest profile for the NIBBLE8 DOS build.
# Windowed + SoundBlaster 16 enabled so audio (the new 22050 + no-interp mixer
# and the fps-decoupled refill) can be heard. Boots the engine normally (no
# --bench, no auto-exit). Adjust CPU speed live with Ctrl+F11 / Ctrl+F12 to
# drop the frame rate and check that audio stays smooth (the fps-decoupling).
[sdl]
output      = surface
autolock    = false
waitonerror = true

[dosbox]
machine      = svga_s3
memsize      = 16
startbanner  = false
fastbioslogo = true
quit warning = false
working directory option = noprompt

[render]
frameskip = 0
aspect    = false

[cpu]
# core=dynamic recompiles (esp. x87 float, which the MOD mixer leans on hard) —
# core=normal interprets it and chokes audio. cycles=max runs full host speed for
# a smooth playtest. Drop to e.g. "fixed 30000" + core=normal to feel real-486 speed.
core    = dynamic
cputype = pentium_mmx
fpu     = true
cycles  = max

[mixer]
nosound  = false
rate     = 44100
prebuffer = 25

[sblaster]
sbtype = sb16
sbbase = 220
irq    = 7
dma    = 1

[speaker]
pcspeaker = false

[autoexec]
mount c "C:\Projects\NIBBLE8\bin\dos"
c:
nibble8.exe
