# Headless 386-class profiling profile for the NIBBLE8 DOS build.
# Runs the engine in --bench mode (uncapped, fixed frame count) and exits.
# Designed to be driven by tools/bench_dos.sh with SDL_VIDEODRIVER=dummy.
#
# CPU is modelled as a 386 with a fixed instruction budget. cycles is the knob
# that approximates clock speed; it is a relative dial, not a cycle-accurate
# 386 model. Keep it constant across runs so results are comparable.
#   ~ 386SX-16 :  cycles ~ 1500
#   ~ 386DX-33 :  cycles ~ 4000   (default below)
#   ~ 386DX-40 :  cycles ~ 5000

[sdl]
output      = surface
videodriver = dummy
waitonerror = false

[dosbox]
machine          = svga_s3
captures         = capture
memsize          = 16
startbanner      = false
fastbioslogo     = true
quit warning     = false
working directory option = noprompt

[render]
frameskip = 0
aspect    = false
scaler    = none

[cpu]
core    = normal
cputype = 386
fpu     = true
cycles  = fixed 4000

[mixer]
nosound = true

[sblaster]
sbtype = none

[speaker]
pcspeaker = false

[autoexec]
mount c "C:\Projects\NIBBLE8\bin\dos"
c:
nibble8.exe --cart bench --bench --bench-frames 600
exit
